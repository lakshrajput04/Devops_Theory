name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build & smoke-test Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t flask-snake:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name snake -p 10000:10000 flask-snake:${{ github.sha }}

      - name: Check /health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:10000/health; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs snake
          exit 1

      - name: Check game page
        run: curl -fsS http://localhost:10000/ | grep -q "Flask Snake"

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo
          echo "Deploy triggered on Render"
